name: release
# local → main → prod. Every push to main publishes `sha-<sha>`; a v* tag
# publishes `<version>`. Production deploys the image by digest after the
# `production` environment is approved.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/qwamicodes/quiet-telemetry

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: summary
        run: |
          {
            echo "### Image"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Pin it: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: image
    runs-on: ubuntu-latest
    # Required reviewers are set on the `production` environment in repo settings.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
      IMAGE_REF: ghcr.io/qwamicodes/quiet-telemetry@${{ needs.image.outputs.digest }}
    steps:
      - name: skip (Dokploy secrets not set)
        if: env.DOKPLOY_URL == '' || env.DOKPLOY_API_KEY == '' || env.APP_ID == ''
        run: |
          echo "Dokploy secrets are not configured; nothing deployed. Image: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: point the Dokploy app at the new digest and deploy
        if: env.DOKPLOY_URL != '' && env.DOKPLOY_API_KEY != '' && env.APP_ID != ''
        run: |
          set -euo pipefail
          api() {
            curl -fsS -X POST "${DOKPLOY_URL%/}/api/$1" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" -H 'Content-Type: application/json' -d "$2"
          }
          api application.saveDockerProvider "$(jq -nc --arg id "$APP_ID" --arg img "$IMAGE_REF" '{applicationId:$id, dockerImage:$img}')"
          api application.deploy "$(jq -nc --arg id "$APP_ID" '{applicationId:$id}')"
          echo "Deployed \`$IMAGE_REF\` to production." >> "$GITHUB_STEP_SUMMARY"
