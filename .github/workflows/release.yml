name: release
# Every push to main publishes `edge`; a vX.Y.Z tag publishes `vX.Y.Z`, `vX.Y`
# and `latest` (amd64 + arm64). Deploying is outside CI: production pulls a tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/qwamicodes/quiet-telemetry

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: date
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # main pushes build amd64 only (prod hosts are amd64, ~5 min instead of ~50);
          # v* tags build both architectures for the release.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # Settings → About shows the commit and build date.
          build-args: |
            QUIET_GIT_SHA=${{ github.sha }}
            QUIET_BUILD_DATE=${{ steps.date.outputs.d }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: summary
        run: |
          {
            echo "### Image"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Pin it: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
