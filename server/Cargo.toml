[package]
name = "quiet"
version = "0.1.0"
edition = "2021"
description = "quiet: a calm, realtime canonical-log viewer"
license = "MIT"

[[bin]]
name = "quiet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tokio-util = { version = "0.7", features = ["rt"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
axum = { version = "0.7", features = ["ws"] }
bollard = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.11.1"
rand = "0.8"
flate2 = "1.1.10"
regex = "1.13.1"
serde_urlencoded = "0.7.1"
prost = "0.13"
argon2 = { version = "0.5", features = ["std"] }
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# argon2 is unusably slow unoptimized (tests and `make dev` hash passwords).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
