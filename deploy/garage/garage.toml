# Garage for quiet's retained history: one node, one copy, local disk.
# The RPC secret and admin token come from GARAGE_RPC_SECRET and
# GARAGE_ADMIN_TOKEN (see deploy/docker-compose.history.yml). quiet sets up
# the layout, bucket and key itself on first start (QUIET_GARAGE_*).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
