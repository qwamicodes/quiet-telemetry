# Local testing: quiet built from source + a sample log generator.
#   make up    (or: docker compose -f deploy/docker-compose.local.yml up --build)
#   open http://127.0.0.1:7070
# No auth yet (accounts land in slice 5): the port stays on loopback.
name: quiet-local
services:
  quiet:
    build: ..
    environment:
      QUIET_ADDR: 0.0.0.0:7070
      QUIET_DATA_DIR: /data
      QUIET_RETENTION: 24h
      QUIET_MAX_DISK: 1GB
      RUST_LOG: quiet=debug,tower_http=warn
    ports: ["127.0.0.1:7070:7070"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Search history survives `make down`/`up`; `docker volume rm quiet-local_quiet-data` resets it.
      - quiet-data:/data
    labels:
      quiet.ignore: "true"
    healthcheck:
      test: ["CMD", "/quiet", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  # Canonical JSON lines for two sources from one process, so flows stitch:
  # sample-api (HTTP requests with wideEvents.calls) is printed to stdout and
  # read through docker.sock; sample-worker (BullMQ-style payout jobs with
  # retries, carrying the request_id that enqueued them) is POSTed to
  # /ingest/ndjson. Both receivers get exercised.
  sample:
    image: oven/bun:1.4.4-alpine
    command: ["bun", "/sample/generate.mjs", "both"]
    volumes: ["./sample:/sample:ro"]
    environment:
      RATE: "4"
      QUIET_URL: http://quiet:7070
      STDOUT_SOURCE: sample-api
    labels:
      quiet.source: sample-api
    depends_on:
      quiet: { condition: service_healthy }

volumes:
  quiet-data:
