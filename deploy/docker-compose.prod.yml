# Production on Dokploy (deploy.legivent.com). Reference for a Compose app;
# with a Dokploy Application, release.yml sets the same image by digest.
# Pin by digest (from the release job summary), never by tag.
name: quiet-prod
services:
  quiet:
    image: ghcr.io/qwamicodes/quiet-telemetry@sha256:REPLACE_WITH_RELEASE_DIGEST
    pull_policy: missing
    restart: unless-stopped
    environment:
      QUIET_ADDR: 0.0.0.0:7070
      QUIET_RING: "10000"
      QUIET_DRAIN_MS: "3000"
      QUIET_SHUTDOWN_TIMEOUT_MS: "10000"
      QUIET_DATA_DIR: /data
      QUIET_RETENTION: 24h   # 1h … 7d
      QUIET_MAX_DISK: 5GB    # oldest hour dropped first; keep below the volume's free space
      # HTTP ingest (Vector, Fluent Bit, OTLP, curl) needs a qi_ token from
      # Settings → Ingest tokens. Defaults shown.
      QUIET_INGEST_AUTH: token
      QUIET_INGEST_MAX_BODY: 16MB
      QUIET_INGEST_RATE: "20000"  # lines/s per token
    # No accounts until slice 5: publish on loopback only, or route through
    # Dokploy's Traefik with access control in front. Shippers on other hosts
    # need a route to /ingest/* and /v1/* (tokens gate those); keep /api and
    # the UI behind access control until accounts land.
    ports: ["127.0.0.1:7070:7070"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The searchable window: SQLite (quiet.db + WAL), hourly partitions.
      - quiet-prod-data:/data
    labels:
      quiet.ignore: "true"
    healthcheck:
      test: ["CMD", "/quiet", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }

volumes:
  quiet-prod-data:
