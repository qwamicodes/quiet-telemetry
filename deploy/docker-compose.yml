# Run quiet next to your app on one host. It reads every container's logs from the socket.
# No auth yet (accounts land in a later slice): keep the port on loopback or behind your proxy.
services:
  quiet:
    build: ..
    ports: ["127.0.0.1:7070:7070"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      quiet.ignore: "true"
